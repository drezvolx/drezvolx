
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 160" width="900" height="160">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#050505"></stop>
      <stop offset="50%" stop-color="#242424"></stop>
      <stop offset="100%" stop-color="#050505"></stop>
    </linearGradient>

    <linearGradient id="movingLight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#080808"></stop>
      <stop offset="35%" stop-color="#444444"></stop>
      <stop offset="50%" stop-color="#eeeeee"></stop>
      <stop offset="65%" stop-color="#444444"></stop>
      <stop offset="100%" stop-color="#080808"></stop>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0;-1 0" dur="9s" repeatCount="indefinite"></animateTransform>
    </linearGradient>

    <radialGradient id="glow">
      <stop offset="0%" stop-color="#eeeeee" stop-opacity=".45"></stop>
      <stop offset="100%" stop-color="#eeeeee" stop-opacity="0"></stop>
    </radialGradient>

    <filter id="blur">
      <feGaussianBlur stdDeviation="22"></feGaussianBlur>
    </filter>
  </defs>

  <rect width="900" height="160" fill="url(#base)"></rect>

  <ellipse cx="450" cy="100" rx="340" ry="65" fill="url(#glow)" filter="url(#blur)">
    <animate attributeName="cx" values="260;640;260" dur="12s" repeatCount="indefinite"></animate>
  </ellipse>

  <path d="M-80 110 Q150 20 360 105 T800 85 T1000 115" fill="none" stroke="url(#movingLight)" stroke-width="2" opacity=".65">
    <animate attributeName="d" values="M-80 110 Q150 20 360 105 T800 85 T1000 115;
                     M-80 85 Q150 140 360 55 T800 125 T1000 85;
                     M-80 110 Q150 20 360 105 T800 85 T1000 115" dur="10s" repeatCount="indefinite"></animate>
  </path>

  <path d="M-80 130 Q200 65 420 125 T850 105 T1000 130" fill="none" stroke="#ffffff" stroke-width="1" opacity=".15">
    <animate attributeName="d" values="M-80 130 Q200 65 420 125 T850 105 T1000 130;
                     M-80 105 Q200 145 420 90 T850 140 T1000 105;
                     M-80 130 Q200 65 420 125 T850 105 T1000 130" dur="14s" repeatCount="indefinite"></animate>
  </path>

  <rect width="900" height="160" fill="url(#movingLight)" opacity=".08"></rect>
</svg>
